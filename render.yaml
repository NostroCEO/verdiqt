# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

# Zero-budget topology (founder decision 2026-08-28): the pipeline worker
# runs INSIDE the free web container (scripts/run-web-and-worker.mjs) because
# paid worker instances require billing setup the founder declined. Same
# worker code and claim contracts, one container; migrations run before both
# processes start. A dedicated worker service returns if billing ever allows.
services:
  - type: web
    name: verdiqt-web
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm migrate:deploy && node scripts/run-web-and-worker.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.23.2"
      - key: DATABASE_URL
        fromDatabase:
          name: verdiqt-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: verdiqt-db
          property: connectionString
      - key: RATE_LIMIT_TRIALS_PER_DAY
        value: "15"
      - key: PUBLIC_TRIALS_ENABLED
        value: "true"
      - key: GITHUB_OAUTH_ENABLED
        value: "false"
      - key: INFERENCE_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: INFERENCE_MODEL
        value: "openai/gpt-oss-120b"
      - key: INFERENCE_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PRODUCT_HUNT_TOKEN
        sync: false

databases:
  - name: verdiqt-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
