# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

# Render Blueprints cannot represent a zero-instance worker. Task 4 adds
# verdiqt-worker after its queue entrypoint exists and the founder approves
# the paid worker instance.
services:
  - type: web
    name: verdiqt-web
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.23.2"
      - key: DATABASE_URL
        fromDatabase:
          name: verdiqt-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: verdiqt-db
          property: connectionString
      - key: RATE_LIMIT_TRIALS_PER_DAY
        value: "5"
      - key: PUBLIC_TRIALS_ENABLED
        value: "false"
      - key: GITHUB_OAUTH_ENABLED
        value: "false"

databases:
  - name: verdiqt-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
