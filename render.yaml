# Exported from Render on 2026-08-30T11:50:07Z
version: "1"
services:
- type: web
  name: verdiqt-web
  runtime: node
  repo: https://github.com/NostroCEO/verdiqt
  plan: 0.5c-512mb
  envVars:
  - key: PRODUCT_HUNT_TOKEN
    sync: false
  - key: RATE_LIMIT_TRIALS_PER_DAY
    sync: false
  - key: GITHUB_TOKEN
    sync: false
  - key: JUDGE_ACCESS_CODE
    sync: false
  - key: AUTH_SECRET
    sync: false
  - key: INFERENCE_API_KEY
    sync: false
  - key: INFERENCE_MODEL
    sync: false
  - key: INFERENCE_BASE_URL
    sync: false
  - key: PUBLIC_TRIALS_ENABLED
    sync: false
  - key: GITHUB_OAUTH_ENABLED
    sync: false
  - key: DIRECT_DATABASE_URL
    fromDatabase:
      name: verdiqt-db
      property: connectionString
  - key: DATABASE_URL
    fromDatabase:
      name: verdiqt-db
      property: connectionString
  - key: NODE_VERSION
    sync: false
  region: frankfurt
  buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
  startCommand: pnpm migrate:deploy && node scripts/run-web-and-worker.mjs
  healthCheckPath: /api/health
  autoDeployTrigger: commit
databases:
- name: verdiqt-db
  databaseName: verdiqt_db
  user: verdiqt_db_user
  plan: 0.1c-256mb
  region: frankfurt
  ipAllowList: []
  postgresMajorVersion: "17"
  diskSizeGB: 1
